; Q Protocol v0.8.12U49 AutoWeaponTriggersF2
; F1 = License To Kill toggle
; F2 = gadget loadout write on the live mission loadout (no memory debug scan)
; F3 = refill de munitions de RESERVE avec le profil MANUAL
; F4 = Manual Q Protocol package
; F5 = alternate exact Q-Pistol RIDs via the same pair-clone primitive as F6-F12
; F6-F12 = configurable validated pair-clone firearm slots
;
; Q-Pistol modes: 0=disabled, 1=silenced, 2=unsilenced.
; Manual/AutoSpawnOneHanded and TwoHanded are EXTRA weapons and now use the
; same shared native SpawnAndEquip path. 0 / None disables a slot.

[WeaponLoadout]
SpawnKey=F4
AmmoKey=F3

; Le Q-Pistol reste declenche depuis l'etat runtime reel du joueur.
; Les armes EXTRA attendent ce delai avant le premier GiveWeapon et entre chaque arme.
; Ce delai ne concerne PAS F5-F12.

; ----- MANUAL F4 PACKAGE -----
ManualSpawnQPistol=1
ManualGiveWeaponDelayMs=500
ManualSpawnOneHanded=MachinePistolHighRecoil
ManualSpawnTwoHanded=ShotgunSemiAuto


; ----- RESERVE AMMO (MANUAL / F3) -----
; Une arme apparait deja avec son chargeur plein.
; Ces valeurs ajoutent uniquement des munitions dans la RESERVE.
; F3 reutilise exactement ce profil MANUAL comme recharge manuelle.
; Classes confirmees uniquement: 0,1,2,5,6,7. Classes 3/4 ignorees.
ManualReserveQPistol=10
ManualReserveSMG=30
ManualReserveAssaultRifle=30
ManualReserveShotgun=8
ManualReserveSniper=5
ManualReserveHeavyPistol=8

; ----- AUTOMATIC PACKAGE -----
AutoSpawnQPistol=1
AutoGiveWeaponDelayMs=500
; AUTO firearms start immediately when the real runtime player object is initialized.
; Mission loadout is NOT used as a weapon-readiness gate.
AutoSpawnOneHanded=HeavyPistol50Cal
AutoSpawnTwoHanded=ARMilitary

; ----- RESERVE AMMO (AUTO) -----
; Meme principe: uniquement de la reserve, jamais le chargeur.
; Le profil AUTO est publie apres les GiveWeapon du package automatique.
AutoReserveQPistol=10
AutoReserveSMG=30
AutoReserveAssaultRifle=30
AutoReserveShotgun=8
AutoReserveSniper=5
AutoReserveHeavyPistol=8

