; Q Protocol - minimal core + overlay target configuration
; Authoritative default mapping:
; F1 = License To Kill
; F2 = Ammo
; F3 = Manual weapon loadout
; F4 = Q-Pistol swap
; F5-F12 = Weapon slots
;
; Overlay default toggle = Insert
; AUTO uses the same gameplay primitives as manual actions.

[Overlay]
Enabled=1
ToggleKey=Insert

[Hotkey_F1]
Action=LicenseToKill

[Hotkey_F2]
Action=Ammo
Profile=Manual

[Hotkey_F3]
Action=ManualLoadout
Profile=Manual

[Hotkey_F4]
Action=SwapQPistol
ModeA=QPistolSilenced
ModeB=QPistolUnsilenced

[Hotkey_F5]
Action=Weapon
Weapon=LightPistolNonLethal

[Hotkey_F6]
Action=Weapon
Weapon=Taser

[Hotkey_F7]
Action=Weapon
Weapon=HeavyPistol50Cal

[Hotkey_F8]
Action=Weapon
Weapon=MachinePistolHighRecoil

[Hotkey_F9]
Action=Weapon
Weapon=SMGNonLethal

[Hotkey_F10]
Action=Weapon
Weapon=AssaultRifleNonLethal

[Hotkey_F11]
Action=Weapon
Weapon=ShotgunSemiAuto

[Hotkey_F12]
Action=Weapon
Weapon=ARMilitary

[ManualLoadout]
Weapon1=QPistolSilenced
Weapon2=MachinePistolHighRecoil
Weapon3=ShotgunSemiAuto

[Auto]
Enabled=1
; AUTO waits for ResolvePlayer(), then calls the SAME ApplyWeaponLoadout()
; and AddAmmo() functions with the values below.
Weapon1=QPistolSilenced
Weapon2=HeavyPistol50Cal
Weapon3=ARMilitary

[ManualAmmo]
QPistol=10
SMG=30
