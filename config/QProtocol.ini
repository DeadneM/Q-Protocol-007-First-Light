; Q Protocol - minimal-core target configuration
; This file describes the NEW architecture.
; It is not a compatibility config for the old U74 cumulative parser.
;
; F1 = License To Kill ON/OFF
; F2 = free
; F3 = add/refill ammo
; F4-F12 = give configured weapon if player is available
; AUTO = call the SAME manual primitives using [Auto] values

[Core]
LicenseKey=F1
AmmoKey=F3

[Auto]
Enabled=1
; AUTO calls the same GiveWeapon() implementation as F4-F12.
Weapon1=QPistolSilenced
Weapon2=HeavyPistol50Cal
Weapon3=ARMilitary

