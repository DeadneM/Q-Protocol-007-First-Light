; 16-byte resolved-template pair experiment. All five requests use the exact SAME
; LightPistolNonLethal donor ItemEntry/Spawner. The source RID (+0x120) and
; adjacent resolved/cache qword (+0x128) are copied together.
; F6 control: donor asks for its own RID.
Weapon1Key=F6
Weapon1=LightPistolNonLethal
; Resident working source graphs used to clone the adjacent resolved template qword.
Weapon2Key=F7
Weapon2=Taser
Weapon3Key=F8
Weapon3=HeavyPistol50Cal
; Q-Pistol variants through the same donor, independent of F5's own graphs.
Weapon4Key=F9
Weapon4=MachinePistolHighRecoil
Weapon5Key=F10
Weapon5=SMGNonLethal
Weapon6Key=F11
Weapon6=AssaultRifleNonLethal
