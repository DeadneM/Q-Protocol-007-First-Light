; Q Protocol - minimal core + overlay target configuration
; Authoritative default mapping:
; F1 = License To Kill
; F2 = Ammo
; F3 = Manual weapon loadout
; F4 = Q-Pistol swap
; F5-F12 = Weapon slots
;
; Overlay default toggle = Insert
; AUTO uses the same gameplay primitives as manual actions.

[Overlay]
Enabled=1
ToggleKey=Insert

[Hotkey_F1]
Action=LicenseToKill

[Hotkey_F2]
Action=Ammo
; A6: Profile is live. Manual -> [ManualAmmo], Auto -> [AutoAmmo].
Profile=Manual

[Hotkey_F3]
Action=ManualLoadout
; A6: Profile is live. Manual -> [ManualLoadout], Auto -> [AutoLoadout].
Profile=Manual

[Hotkey_F4]
Action=SwapQPistol
ModeA=QPistolSilenced
ModeB=QPistolUnsilenced

[Hotkey_F5]
Action=Weapon
Weapon=LightPistolNonLethal

[Hotkey_F6]
Action=Weapon
Weapon=Taser

[Hotkey_F7]
Action=Weapon
Weapon=HeavyPistol50Cal

[Hotkey_F8]
Action=Weapon
Weapon=MachinePistolHighRecoil

[Hotkey_F9]
Action=Weapon
Weapon=SMGNonLethal

[Hotkey_F10]
Action=Weapon
Weapon=AssaultRifleNonLethal

[Hotkey_F11]
Action=Weapon
Weapon=ShotgunSemiAuto

[Hotkey_F12]
Action=Weapon
Weapon=ARMilitary

[ManualLoadout]
; The game supports exactly three weapon roles.
QPistol=QPistolSilenced
OneHanded=MachinePistolHighRecoil
TwoHanded=ShotgunSemiAuto

[Auto]
; 1 = apply AutoLoadout + AutoAmmo once whenever a new playable READY cycle starts.
; 0 = disable automatic application completely.
Enabled=1

[AutoLoadout]
; AUTO uses the exact same three-role loadout model as Manual.
; It goes through the SAME shared GiveWeapon queue and 500 ms stabilization.
QPistol=QPistolSilenced
OneHanded=HeavyPistol50Cal
TwoHanded=ARMilitary

[ManualAmmo]
; F2 ADDS these values to the firearm reserve through the game's native
; AddFirearmAmmunitionToPlayer input. 0 disables a class.
; Confirmed weapon classes only: 0,1,2,5,6,7. Classes 3/4 are not exposed.
QPistol=10
SMG=30
AssaultRifle=30
Shotgun=8
Sniper=5
HeavyPistol=8

[AutoAmmo]
; AUTO uses these values through the SAME native AddAmmo() implementation as F2.
; Values are additive reserve ammunition. 0 disables a class.
QPistol=10
SMG=30
AssaultRifle=30
Shotgun=8
Sniper=5
HeavyPistol=8

