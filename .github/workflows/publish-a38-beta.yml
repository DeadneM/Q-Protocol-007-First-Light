name: Publish verified A38 beta artifact
on:
  workflow_dispatch:
  push:
    branches: [experiment/a38-nov5-remap]
    paths: [".github/workflows/publish-a38-beta.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/experiment/a38-nov5-remap'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check frozen source and successful full build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = '5bc3ac2d64567328b6ab079bb79599ba890cf5ec'
          git diff --exit-code $source HEAD -- src config updater tests tools/package_a35.py tools/verify_a35_scope.py tools/verify_a38_scope.py tools/verify_a38_executable.py evidence/nov2026/a38-native-map.json .github/workflows/build-a35-session.yml
          if ($LASTEXITCODE -ne 0) { throw 'Source changed after reviewed build' }
          $run = gh api repos/${{ github.repository }}/actions/runs/42022238890 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $source -or $run.conclusion -ne 'success' -or $run.status -ne 'completed') {
            throw 'Frozen A38 full build not verified successful'
          }
      - uses: actions/download-artifact@v4
        with:
          name: Q-Protocol_A38_Nov5Remap_TEST
          run-id: 42022238890
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify ZIP and write compatible beta manifest
        shell: pwsh
        run: |
          @'
          import hashlib,json,struct,zipfile
          from pathlib import Path
          root=Path('candidate')
          name='Q-Protocol_A38_Nov5Remap_TEST.zip'
          data=(root/name).read_bytes()
          assert len(data)==591373 and hashlib.sha256(data).hexdigest()=='7bc3cd58d903e2bd2fa9f1052119f8d89a7798774b7554bc9e240c16c7944150'
          expected={'dxgi.dll':(138240,'40f8ba044d11d01dba8e5bdbfcb850f34826b485ca95bcbf93803ca869920625'),
                    'QProtocol.asi':(1023488,'ddde581e5930fe3f139d9d8b8a25bbd74cef5ac0e4d984a09b9d4f45c7fc7592')}
          with zipfile.ZipFile(root/name) as archive:
              assert archive.namelist()==list(expected) and archive.testzip() is None
              for file,(size,sha) in expected.items():
                  value=archive.read(file)
                  assert len(value)==size and hashlib.sha256(value).hexdigest()==sha
                  assert value[:2]==b'MZ'
                  pe=struct.unpack_from('<I',value,0x3c)[0]
                  assert value[pe:pe+4]==b'PE\0\0' and struct.unpack_from('<H',value,pe+4)[0]==0x8664
          tag='a38-nov5-remap-test'
          manifest={'schema':1,'build':38,'tag':tag,'exe_sha256':'f92c0e8600aa3b692a437f2c0795068f509db1a73a4794b619e6d60bd5d35c43',
                    'package':name,'url':f'https://github.com/DeadneM/Q-Protocol-007-First-Light/releases/download/{tag}/{name}',
                    'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),
                    'files':{file:{'size':size,'sha256':sha} for file,(size,sha) in expected.items()}}
          (root/'QProtocol-update.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print('Verified frozen A38 ZIP and compatible beta manifest; no rebuild.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'A38 package/manifest verification failed' }
      - name: Publish immutable prerelease from frozen source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'a38-nov5-remap-test'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'A38 release exists; refusing overwrite' }
          git ls-remote --exit-code --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 2) { throw 'Tag exists or remote check failed; refusing publication' }
          gh release create $tag candidate/Q-Protocol_A38_Nov5Remap_TEST.zip candidate/QProtocol-update.json --repo '${{ github.repository }}' --target '5bc3ac2d64567328b6ab079bb79599ba890cf5ec' --prerelease --title 'Q Protocol A38 - November 5 Remap TEST' --notes-file docs/A38_NOV5_REMAP.md
          if ($LASTEXITCODE -ne 0) { throw 'A38 beta publication failed' }
