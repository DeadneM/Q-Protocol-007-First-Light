name: Build Fresh Core - Native DXGI Bundled

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev/a19-qpistol-native-bootstrap
      - dev/a20c-package-sequencer-native-confirmation
      - dev/a20d-game-update-remap
      - dev/a20e-player-loadout-vtable-fix
      - dev/a20f-direct-native-weapon-graphs
      - dev/a20g-mod-weapon-slots
      - dev/a20h-weapons-debug-ltk-force-toggle
      - dev/a20i-native-ltk-state-toggle
      - dev/a20j-clean-core
      - dev/first-debug
      - dev/a21-overlay-compat
      - dev/a22-mouse-input
      - dev/a23-dynamic-weapon-graph
      - dev/a24-weapon-queue-safety
      - release/v0.9.5-a24
    paths:
      - "src/**"
      - "config/QProtocol.ini"
      - "packaging/**"
      - ".github/workflows/build-fresh-core.yml"
      - "tools/generate_dxgi_proxy.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate real DXGI exports, ordinal map, and x64 thunks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $systemDxgi = Join-Path $env:WINDIR "System32\dxgi.dll"
          if (-not (Test-Path $systemDxgi)) { throw "Windows System32 dxgi.dll absent" }
          dumpbin /nologo /exports $systemDxgi | Set-Content -Encoding utf8 dist\dxgi_system_exports.txt
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for system DXGI" }
          python tools/generate_dxgi_proxy.py --dump dist/dxgi_system_exports.txt --out dist
          if ($LASTEXITCODE -ne 0) { throw "DXGI generation failed" }

      - name: Build local dxgi.dll proxy and DXGI ABI smoke test
        shell: cmd
        run: |
          ml64 /nologo /c /Fo dist\dxgi_proxy_exports.obj dist\dxgi_proxy_exports.asm
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /O2 /EHsc /W4 /MT /LD /DUNICODE /D_UNICODE /I dist src\dxgi_proxy\ProxyDxgi.cpp dist\dxgi_proxy_exports.obj kernel32.lib /link /DEF:dist\dxgi_proxy.def /OUT:dist\dxgi.dll
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /O2 /EHsc /W4 /MT /DUNICODE /D_UNICODE src\dxgi_proxy\DxgiSmoke.cpp /Fe:dist\DxgiSmoke.exe
          if errorlevel 1 exit /b 1

      - name: Audit exact DXGI system exports and standalone dependencies
        shell: pwsh
        run: |
          dumpbin /nologo /exports dist\dxgi.dll | Set-Content -Encoding utf8 dist\dxgi_proxy_actual_exports.txt
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for compiled proxy" }
          python tools/generate_dxgi_proxy.py --dump dist/dxgi_system_exports.txt --out dist --verify dist/dxgi_proxy_actual_exports.txt
          if ($LASTEXITCODE -ne 0) { throw "DXGI ABI mismatch" }
          dumpbin /nologo /dependents dist\dxgi.dll | Set-Content -Encoding utf8 dist\dxgi_proxy_dependents.txt
          if ($LASTEXITCODE -ne 0) { throw "DXGI dependency audit failed" }
          $deps = Get-Content dist\dxgi_proxy_dependents.txt -Raw
          if ($deps -match "VCRUNTIME\d*\.dll|MSVCP\d*\.dll|ucrtbase\.dll|D3DCompiler_47.dll") {
            throw "Unexpected external runtime dependency"
          }
          if ($deps -notmatch "KERNEL32.dll") { throw "Expected Kernel32 dependency missing" }
          Write-Host "Custom x64 DXGI proxy import/ABI checks PASS."

      - name: Run native CreateDXGIFactory1 smoke test
        shell: pwsh
        run: |
          $env:QPROTOCOL_DXGI_NO_ASI = "1"
          Push-Location dist
          try {
            .\DxgiSmoke.exe
            if ($LASTEXITCODE -ne 0) { throw "Native CreateDXGIFactory1 proxy call failed: $LASTEXITCODE" }
            $smoke = Get-Content QProtocolDXGI.log -Raw
            if ($smoke -notmatch "Real System32 DXGI loaded: yes") {
              throw "Proxy failed to locate System32 DXGI"
            }
            if ($smoke -notmatch "QProtocol.asi: skipped for CI smoke check") {
              throw "Unexpected ASI behavior during CI smoke"
            }
            Write-Host "Custom DXGI proxy native forwarding smoke PASS."
          }
          finally {
            Pop-Location
            Remove-Item Env:QPROTOCOL_DXGI_NO_ASI -ErrorAction SilentlyContinue
          }

      - name: Fetch pinned overlay dependencies
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.91.5 https://github.com/ocornut/imgui.git _deps/imgui
          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git _deps/minhook

      - name: Validate weapon catalog consistency
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path("config/QProtocol.ini")
          lines = path.read_text(encoding="utf-8").splitlines()

          sections = {}
          current = None
          for line_no, raw in enumerate(lines, 1):
              line = raw.strip()
              if not line or line.startswith(";"):
                  continue
              if line.startswith("[") and line.endswith("]"):
                  current = line[1:-1]
                  sections.setdefault(current, [])
                  continue
              if current and "=" in line:
                  key, value = line.split("=", 1)
                  sections[current].append((key.strip(), value.strip(), line_no))

          def table(name):
              rows = sections.get(name, [])
              out = {}
              for key, value, line_no in rows:
                  if key in out:
                      raise SystemExit(f"Duplicate alias in [{name}]: {key} at line {line_no}")
                  out[key] = value
              return out

          weapons = table("WeaponCatalog")
          roles = table("WeaponRole")
          statuses = table("WeaponValidation")
          runtime = table("RuntimeCatalog")
          previous = table("WeaponPreviousRid")

          rid_owner = {}
          for alias, rid in weapons.items():
              rid_u = rid.upper()
              if rid_u in rid_owner:
                  raise SystemExit(
                      f"Duplicate WeaponCatalog RID {rid_u}: "
                      f"{rid_owner[rid_u]} and {alias}"
                  )
              rid_owner[rid_u] = alias

          runtime_rids = {}
          for alias, rid in runtime.items():
              rid_u = rid.upper()
              if rid_u in runtime_rids:
                  raise SystemExit(
                      f"Duplicate RuntimeCatalog RID {rid_u}: "
                      f"{runtime_rids[rid_u]} and {alias}"
                  )
              runtime_rids[rid_u] = alias

          overlap = sorted(set(rid_owner) & set(runtime_rids))
          if overlap:
              raise SystemExit(
                  "WeaponCatalog / RuntimeCatalog RID overlap: " +
                  ", ".join(overlap)
              )

          current_vs_previous = sorted(
              set(rid_owner) &
              {v.upper() for v in previous.values()}
          )
          if current_vs_previous:
              raise SystemExit(
                  "Current weapon reuses archived stale RID: " +
                  ", ".join(current_vs_previous)
              )

          weapon_aliases = set(weapons)
          if set(roles) != weapon_aliases:
              missing = sorted(weapon_aliases - set(roles))
              extra = sorted(set(roles) - weapon_aliases)
              raise SystemExit(
                  f"WeaponRole mismatch missing={missing} extra={extra}"
              )

          if set(statuses) != weapon_aliases:
              missing = sorted(weapon_aliases - set(statuses))
              extra = sorted(set(statuses) - weapon_aliases)
              raise SystemExit(
                  f"WeaponValidation mismatch missing={missing} extra={extra}"
              )

          valid_roles = {"QPistol", "OneHanded", "TwoHanded", "Any"}
          bad_roles = {
              alias: role
              for alias, role in roles.items()
              if role not in valid_roles
          }
          if bad_roles:
              raise SystemExit(f"Invalid WeaponRole values: {bad_roles}")

          valid_status = {"Validated", "Not Working", "Experimental"}
          bad_status = {
              alias: status
              for alias, status in statuses.items()
              if status not in valid_status
          }
          if bad_status:
              raise SystemExit(f"Invalid WeaponValidation values: {bad_status}")

          def require_alias(section, key, allow_none=False):
              values = table(section)
              value = values.get(key, "")
              if allow_none and value in {"None", "Off"}:
                  return
              if value and value not in weapons:
                  raise SystemExit(
                      f"[{section}] {key} references unknown weapon alias: {value}"
                  )

          require_alias("Hotkey_F4", "ModeA")
          require_alias("Hotkey_F4", "ModeB")
          for n in range(5, 13):
              require_alias(f"Hotkey_F{n}", "Weapon")
          for sec in ("ManualLoadout", "AutoLoadout"):
              require_alias(sec, "QPistol", allow_none=True)
              require_alias(sec, "OneHanded", allow_none=True)
              require_alias(sec, "TwoHanded", allow_none=True)

          rid_pattern = re.compile(r"^[0-9A-Fa-f]{16}$")
          for section_name, mapping in (
              ("WeaponCatalog", weapons),
              ("RuntimeCatalog", runtime),
              ("WeaponPreviousRid", previous),
          ):
              for alias, rid in mapping.items():
                  if not rid_pattern.fullmatch(rid):
                      raise SystemExit(
                          f"[{section_name}] invalid 16-hex RID for {alias}: {rid}"
                      )

          runtime_categories = table("RuntimeCategory")
          if set(runtime_categories) != set(runtime):
              missing = sorted(set(runtime) - set(runtime_categories))
              extra = sorted(set(runtime_categories) - set(runtime))
              raise SystemExit(
                  f"RuntimeCategory mismatch missing={missing} extra={extra}"
              )

          if len(set(v.upper() for v in previous.values())) != len(previous):
              raise SystemExit("Duplicate RID inside [WeaponPreviousRid]")

          if not set(previous).issubset(set(weapons)):
              raise SystemExit(
                  "WeaponPreviousRid contains alias absent from WeaponCatalog"
              )

          auto = table("Auto")
          if auto.get("Enabled") not in {"0", "1"}:
              raise SystemExit("[Auto] Enabled must be 0 or 1")

          overlay = table("Overlay")
          if not overlay.get("ToggleKey", "").strip():
              raise SystemExit("[Overlay] ToggleKey must be present and non-empty")

          ammo_keys = {
              "QPistol", "SMG", "AssaultRifle",
              "Shotgun", "Sniper", "HeavyPistol"
          }
          for section_name in ("ManualAmmo", "AutoAmmo"):
              ammo = table(section_name)
              if set(ammo) != ammo_keys:
                  missing = sorted(ammo_keys - set(ammo))
                  extra = sorted(set(ammo) - ammo_keys)
                  raise SystemExit(
                      f"[{section_name}] keys mismatch missing={missing} extra={extra}"
                  )
              for key, value in ammo.items():
                  if not value.isdigit():
                      raise SystemExit(
                          f"[{section_name}] {key} is not an integer: {value}"
                      )
                  amount = int(value)
                  if amount < 0 or amount > 100000:
                      raise SystemExit(
                          f"[{section_name}] {key} out of range: {amount}"
                      )

          print(
              f"Full config audit PASS: {len(weapons)} weapons, "
              f"{len(runtime)} runtime-only items, strict RID/category/default checks OK."
          )
          '@ | python -

      - name: Verify A20J gameplay invariants
        shell: pwsh
        run: |
          $protected = @(
            "src/GameplayHook.asm",
            "src/Overlay.h",
            "config/QProtocol.ini"
          )

          git diff --exit-code v0.9.4 -- $protected
          if ($LASTEXITCODE -ne 0) {
            throw "A24 must not change validated A20J gameplay/config files."
          }

          Write-Host "Protected gameplay/config invariant PASS. A24 queue guard is separately audited."

      - name: Audit A24 isolated weapon queue safety
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import subprocess

          prior = subprocess.check_output(
              ["git", "show", "origin/dev/a23-dynamic-weapon-graph:src/QProtocol.cpp"],
              text=True, encoding="utf-8"
          )
          now = Path("src/QProtocol.cpp").read_text(encoding="utf-8")
          extras = (
              "std::deque<ULONGLONG> g_recentUnitaryWeaponRequests;\n"
              "constexpr std::size_t kUnitaryPendingLimit = 4;\n"
              "constexpr std::size_t kUnitaryBurstLimit = 12;\n"
              "constexpr ULONGLONG kUnitaryBurstWindowMs = 30000;\n"
          )
          if extras not in now:
              raise SystemExit("A24 expected queue guard globals missing")

          def neutralize(source, a24):
              begin = source.index("bool QueueWeapon(std::uint64_t rid, const char* source) {")
              end = source.index("bool QueueAmmoProfile(", begin)
              source = source[:begin] + "[A24 QUEUE GUARD ONLY]\n" + source[end:]
              if a24:
                  source = source.replace(extras, "")
                  source = source.replace(
                      "    g_recentUnitaryWeaponRequests.clear();\n", "")
                  source = source.replace(
                      "// A24: bounded burst protection for manual F4-F12 and Debug Spawn only.\n"
                      "// Worker-thread state; AUTO/F3 package transaction and native spawn unchanged.\n",
                      "")
              return source

          if neutralize(prior, False) != neutralize(now, True):
              raise SystemExit("A24 gameplay regression outside new queue guard")
          for key in (
              "kUnitaryPendingLimit = 4",
              "kUnitaryBurstLimit = 12",
              "kUnitaryBurstWindowMs = 30000",
              "g_activeWeapon.requestedRid == rid",
              "std::find(g_weaponQueue.begin()",
              "g_recentUnitaryWeaponRequests.push_back(now)",
              "g_recentUnitaryWeaponRequests.clear()",
              "A23 graph index:",
              "scanRange(kGraphScanBegin, kGraphScanEnd)",
          ):
              if key not in now:
                  raise SystemExit("A24 safety or A23 graph regression: " + key)
          print("A24 gameplay isolation PASS: only isolated F4-F12/Debug queue guard; A23 scanner and native F1/F2/F3/AUTO unchanged.")
          '@ | python -

      - name: Audit A24 overlay compatibility architecture
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          src = Path("src/OverlayA19.cpp").read_text(encoding="utf-8")

          forbidden = [
              "ImGuiWindowFlags_NoTitleBar",
              "ImGuiWindowFlags_NoResize",
              "ImGuiWindowFlags_NoMove",
              "ImGuiCond_Always"
          ]

          for token in forbidden:
              if token in src:
                  raise SystemExit(f"A24 fixed-window regression: {token}")

          required = [
              "ImGuiCond_FirstUseEver",
              "ImGui::SetNextWindowSizeConstraints",
              "A22 ImGui mouse-down received",
              "msg == WM_INPUT",
              "io.WantCaptureKeyboard",
              "IsMouseInputMessage",
              "IsKeyboardInputMessage",
              "AcquireOverlayCursorClip",
              "ReleaseOverlayCursorClip",
              "A21 compatibility renderer"
          ]

          for token in required:
              if token not in src:
                  raise SystemExit(f"A24 compatibility invariant missing: {token}")

          if "IsInputMessage(msg)" in src:
              raise SystemExit("A24 regression: blanket input swallowing returned.")

          if "std::try_to_lock" in src:
              raise SystemExit("A24 regression: input can be dropped on render-lock contention.")
          if "IsMouseInputMessage(msg) &&" in src:
              raise SystemExit("A24 regression: frame-stale mouse capture gate returned.")

          print("A24 mouse input audit PASS: modal mouse ownership, no lossy try-lock, raw input cleanup, A21 floating UI retained.")
          '@ | python -

      - name: Compile A24 ImGui shaders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/shaders | Out-Null

          $fxc = Get-Command fxc.exe -ErrorAction SilentlyContinue
          if (-not $fxc) {
            $candidates = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending
            $fxc = $candidates | Select-Object -First 1
          }

          if (-not $fxc) {
            throw "fxc.exe not found in Windows SDK."
          }

          $fxcPath = if ($fxc.Source) { $fxc.Source } else { $fxc.FullName }
          Write-Host "Using FXC: $fxcPath"

          & $fxcPath /nologo /T vs_5_0 /E main /O3 /Fh dist/shaders/FirstDebugImGuiVS.h /Vn g_FirstDebugImGuiVS src/first_debug/imgui_vs.hlsl
          if ($LASTEXITCODE -ne 0) { throw "Vertex shader compilation failed." }

          & $fxcPath /nologo /T ps_5_0 /E main /O3 /Fh dist/shaders/FirstDebugImGuiPS.h /Vn g_FirstDebugImGuiPS src/first_debug/imgui_ps.hlsl
          if ($LASTEXITCODE -ne 0) { throw "Pixel shader compilation failed." }

          if (-not (Test-Path dist/shaders/FirstDebugImGuiVS.h) -or
              -not (Test-Path dist/shaders/FirstDebugImGuiPS.h)) {
            throw "Embedded shader headers were not generated."
          }

          Write-Host "Build-time shader compilation PASS."

      - name: Build QProtocol.asi
        shell: cmd
        run: |
          if not exist dist mkdir dist
          ml64 /nologo /c /Fo dist\GameplayHook.obj src\GameplayHook.asm
          cl /nologo /std:c++20 /O2 /EHsc /W4 /MT /LD /DUNICODE /D_UNICODE ^
            /I _deps\imgui ^
            /I _deps\imgui\backends ^
            /I _deps\minhook\include ^
            /I _deps\minhook\src ^
            /I dist\shaders ^
            src\QProtocol.cpp src\OverlayA19.cpp ^
            _deps\imgui\imgui.cpp ^
            _deps\imgui\imgui_draw.cpp ^
            _deps\imgui\imgui_tables.cpp ^
            _deps\imgui\imgui_widgets.cpp ^
            _deps\imgui\backends\imgui_impl_win32.cpp ^
            src\first_debug\imgui_impl_dx12_first_debug.cpp ^
            _deps\minhook\src\buffer.c ^
            _deps\minhook\src\hook.c ^
            _deps\minhook\src\trampoline.c ^
            _deps\minhook\src\hde\hde64.c ^
            dist\GameplayHook.obj ^
            user32.lib kernel32.lib d3d12.lib dxgi.lib ^
            /link /OUT:dist\QProtocol.asi

      - name: Audit A24 PE dependencies
        shell: pwsh
        run: |
          dumpbin /imports dist\QProtocol.asi | Tee-Object -FilePath dist\A24_IMPORTS.txt
          dumpbin /dependents dist\QProtocol.asi | Tee-Object -FilePath dist\A24_DEPENDENTS.txt

          $imports = Get-Content dist\A24_IMPORTS.txt -Raw
          $deps = Get-Content dist\A24_DEPENDENTS.txt -Raw

          if ($imports -match "WriteProcessMemory") {
            throw "A24 regression: WriteProcessMemory is imported."
          }

          if ($imports -notmatch "ReadProcessMemory") {
            throw "A24 audit mismatch: expected ReadProcessMemory import not found."
          }

          if ($imports -notmatch "VirtualProtect") {
            throw "A24 audit mismatch: expected VirtualProtect import not found."
          }

          if ($deps -match "D3DCompiler_47\.dll") {
            throw "A24 regression: runtime D3DCompiler_47 dependency still present."
          }

          if ($deps -match "VCRUNTIME\d*\.dll" -or
              $deps -match "MSVCP\d*\.dll" -or
              $deps -match "ucrtbase\.dll") {
            throw "A24 regression: dynamic MSVC/UCRT runtime dependency detected."
          }

          foreach ($required in @("D3D12.dll", "DXGI.dll", "USER32.dll", "KERNEL32.dll")) {
            if ($deps -notmatch [regex]::Escape($required)) {
              throw "Expected Windows system dependency missing from PE audit: $required"
            }
          }

          if (Select-String -Path src\first_debug\imgui_impl_dx12_first_debug.cpp -Pattern "^[^/\r\n]*\bD3DCompile\s*\(" -Quiet) {
            throw "Runtime D3DCompile call found in hardened backend source."
          }

          $asi = Get-Item dist\QProtocol.asi
          $sha = (Get-FileHash dist\QProtocol.asi -Algorithm SHA256).Hash
          Write-Host ("A24 ASI size: {0} bytes" -f $asi.Length)
          Write-Host ("A24 ASI SHA-256: {0}" -f $sha)
          Write-Host "A24 dependency audit PASS."
          Write-Host "No separate ImGui, MinHook, D3DCompiler or VC++ runtime installation is required by this build."

      - name: Upload A24 dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: Q-Protocol_A24_DependencyAudit
          path: |
            dist/A24_IMPORTS.txt
            dist/A24_DEPENDENTS.txt
          if-no-files-found: error

      - name: Prepare A24 test files
        shell: pwsh
        run: |
          Copy-Item config/QProtocol.ini dist/QProtocol.ini -Force
          Copy-Item packaging/README_NEXT_DXGI.txt dist/README.txt -Force

          $files = @(
            "dist/dxgi.dll",
            "dist/QProtocol.asi",
            "dist/QProtocol.ini",
            "dist/README.txt"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing A24 package file: $file"
            }

            $item = Get-Item $file
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            Write-Host ("{0}: {1} bytes SHA-256 {2}" -f $item.Name, $item.Length, $hash)
          }

      - name: Build future cumulative DXGI-bundled ZIP
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib
          import zipfile

          dist = Path("dist")
          names = ["dxgi.dll", "QProtocol.asi", "QProtocol.ini", "README.txt"]
          out = dist / "Q-Protocol_Next_CustomDXGI_CI.zip"

          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in names:
                  z.write(dist / name, arcname=name)

          with zipfile.ZipFile(out, "r") as z:
              actual = z.namelist()
              if actual != names:
                  raise SystemExit(f"Flat package invariant failed: {actual}")
              if any("/" in name or "\\" in name for name in actual):
                  raise SystemExit(f"Nested ZIP path detected: {actual}")

          print(f"ZIP: {out.stat().st_size} bytes SHA-256 {hashlib.sha256(out.read_bytes()).hexdigest()}")
          '@ | python -

      - name: Upload future DXGI-bundled CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q-Protocol_Next_CustomDXGI_CI
          path: |
            dist/dxgi.dll
            dist/QProtocol.asi
            dist/QProtocol.ini
            dist/README.txt
          if-no-files-found: error

      - name: Guard existing stable tag and future packaging convention
        shell: pwsh
        run: |
          Write-Host "No release tag is created by the generic build workflow."
          Write-Host "Existing public v0.9.5 is immutable and must not be clobbered."
          Write-Host "Future numbered releases must use a new tag and include dxgi.dll,"
          Write-Host "QProtocol.asi, QProtocol.ini, README.txt at ZIP root."
          Write-Host "The ASI core source is not modified by DXGI packaging."
