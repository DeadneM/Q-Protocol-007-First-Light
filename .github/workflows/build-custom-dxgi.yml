name: Custom DXGI Native Loader TEST

on:
  workflow_dispatch:
  push:
    branches:
      - dev/dxgi-native-loader-test
    paths:
      - "src/dxgi_proxy/**"
      - "tools/generate_dxgi_proxy.py"
      - "packaging/README_DXGI_TEST.txt"
      - ".github/workflows/build-custom-dxgi.yml"

permissions:
  contents: write

jobs:
  proxy:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate real DXGI exports, ordinal map, and x64 thunks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $systemDxgi = Join-Path $env:WINDIR "System32\dxgi.dll"
          if (-not (Test-Path $systemDxgi)) { throw "Windows System32 dxgi.dll absent" }
          dumpbin /nologo /exports $systemDxgi | Set-Content -Encoding utf8 dist\dxgi_system_exports.txt
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for system DXGI" }
          python tools/generate_dxgi_proxy.py --dump dist/dxgi_system_exports.txt --out dist
          if ($LASTEXITCODE -ne 0) { throw "DXGI generation failed" }

      - name: Build local dxgi.dll proxy and DXGI ABI smoke test
        shell: cmd
        run: |
          ml64 /nologo /c /Fo dist\dxgi_proxy_exports.obj dist\dxgi_proxy_exports.asm
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /O2 /EHsc /W4 /MT /LD /DUNICODE /D_UNICODE /I dist src\dxgi_proxy\ProxyDxgi.cpp dist\dxgi_proxy_exports.obj kernel32.lib /link /DEF:dist\dxgi_proxy.def /OUT:dist\dxgi.dll
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /O2 /EHsc /W4 /MT /DUNICODE /D_UNICODE src\dxgi_proxy\DxgiSmoke.cpp /Fe:dist\DxgiSmoke.exe
          if errorlevel 1 exit /b 1

      - name: Audit exact DXGI system exports and standalone dependencies
        shell: pwsh
        run: |
          dumpbin /nologo /exports dist\dxgi.dll | Set-Content -Encoding utf8 dist\dxgi_proxy_actual_exports.txt
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for compiled proxy" }
          python tools/generate_dxgi_proxy.py --dump dist/dxgi_system_exports.txt --out dist --verify dist/dxgi_proxy_actual_exports.txt
          if ($LASTEXITCODE -ne 0) { throw "DXGI ABI mismatch" }
          dumpbin /nologo /dependents dist\dxgi.dll | Set-Content -Encoding utf8 dist\dxgi_proxy_dependents.txt
          if ($LASTEXITCODE -ne 0) { throw "DXGI dependency audit failed" }
          $deps = Get-Content dist\dxgi_proxy_dependents.txt -Raw
          if ($deps -match "VCRUNTIME\d*\.dll|MSVCP\d*\.dll|ucrtbase\.dll|D3DCompiler_47.dll") {
            throw "Unexpected external runtime dependency"
          }
          if ($deps -notmatch "KERNEL32.dll") { throw "Expected Kernel32 dependency missing" }
          Write-Host "Custom x64 DXGI proxy import/ABI checks PASS."

      - name: Run native CreateDXGIFactory1 smoke test
        shell: pwsh
        run: |
          $env:QPROTOCOL_DXGI_NO_ASI = "1"
          Push-Location dist
          try {
            .\DxgiSmoke.exe
            if ($LASTEXITCODE -ne 0) { throw "Native CreateDXGIFactory1 proxy call failed: $LASTEXITCODE" }
            $smoke = Get-Content QProtocolDXGI.log -Raw
            if ($smoke -notmatch "Real System32 DXGI loaded: yes") {
              throw "Proxy failed to locate System32 DXGI"
            }
            if ($smoke -notmatch "QProtocol.asi: skipped for CI smoke check") {
              throw "Unexpected ASI behavior during CI smoke"
            }
            Write-Host "Custom DXGI proxy native forwarding smoke PASS."
          }
          finally {
            Pop-Location
            Remove-Item Env:QPROTOCOL_DXGI_NO_ASI -ErrorAction SilentlyContinue
          }

      - name: Fetch and verify exact stable v0.9.5 ASI and INI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.9.5 --repo $env:GITHUB_REPOSITORY --pattern "Q-Protocol_v0.9.5.zip" --dir dist
          if ($LASTEXITCODE -ne 0) { throw "Cannot retrieve stable v0.9.5 release" }
          @'
          from pathlib import Path
          import zipfile, hashlib

          release = Path("dist/Q-Protocol_v0.9.5.zip")
          expected = {
              "QProtocol.asi": "9e8c58f6b0e1d36592f8ada8606e0e304a816bc86358274f57a371718eb74cee",
              "QProtocol.ini": "8f644b75ff5059efd1acae410c85e9963e847872f0d410ec28d73194a2d27022",
          }
          with zipfile.ZipFile(release) as z:
              if z.namelist() != ["QProtocol.asi", "QProtocol.ini", "README.txt"]:
                  raise SystemExit("Unexpected stable ZIP file layout")
              for name, wanted in expected.items():
                  data = z.read(name)
                  got = hashlib.sha256(data).hexdigest()
                  if got != wanted:
                      raise SystemExit(f"Stable release {name} checksum changed: {got}")
                  (Path("dist") / name).write_bytes(data)
                  print(f"Exact official v0.9.5 {name}: {len(data)} bytes SHA-256 {got}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Stable ASI/INI audit failed" }
          Copy-Item packaging/README_DXGI_TEST.txt dist/README.txt -Force

      - name: Package root-only dxgi.dll, ASI, INI and README
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import zipfile, hashlib

          dist = Path("dist")
          files = ["dxgi.dll", "QProtocol.asi", "QProtocol.ini", "README.txt"]
          for name in files:
              data = (dist / name).read_bytes()
              print(f"{name}: {len(data)} bytes SHA-256 {hashlib.sha256(data).hexdigest()}")
          target = dist / "Q-Protocol_v0.9.5_CustomDXGI_TEST.zip"
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in files:
                  z.write(dist / name, arcname=name)
          with zipfile.ZipFile(target) as z:
              assert z.namelist() == files, "nested paths or unexpected files"
          print(f"DXGI TEST ZIP: {target.stat().st_size} bytes SHA-256 {hashlib.sha256(target.read_bytes()).hexdigest()}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "DXGI ZIP packaging failed" }

      - name: Upload custom DXGI test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q-Protocol_v0.9.5_CustomDXGI_TEST
          path: dist/Q-Protocol_v0.9.5_CustomDXGI_TEST.zip
          if-no-files-found: error

      - name: Publish isolated Custom DXGI TEST prerelease
        if: github.ref == 'refs/heads/dev/dxgi-native-loader-test'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dxgi-native-test"
          $asset = "dist/Q-Protocol_v0.9.5_CustomDXGI_TEST.zip"
          $title = "Q Protocol v0.9.5 - Custom Native DXGI Loader TEST"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed DXGI asset upload" }
            gh release edit $tag --target $env:GITHUB_SHA --title $title --prerelease --notes-file docs/CUSTOM_DXGI.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --title $title --prerelease --notes-file docs/CUSTOM_DXGI.md --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed DXGI prerelease publication" }
