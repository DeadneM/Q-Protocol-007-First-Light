name: Withdraw rejected A36 from beta discovery
on:
  push:
    branches: [experiment/a36-native-delivery]
    paths: [".github/workflows/withdraw-a36-beta.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  withdraw:
    if: github.ref == 'refs/heads/experiment/a36-native-delivery'
    runs-on: ubuntu-latest
    steps:
      - name: Preserve release as draft so updater no longer offers it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name == "a36-native-delivery-test" or .name == "REJECTED - Q Protocol A36 Native Delivery TEST") | .id')
          test -n "$release_id"
          test "$(printf '%s\n' "$release_id" | wc -l)" -eq 1
          gh api --method PATCH repos/${{ github.repository }}/releases/"$release_id" -F draft=true -f name='REJECTED - Q Protocol A36 Native Delivery TEST'
          gh api repos/${{ github.repository }}/releases/"$release_id" --jq '.draft' | grep -x true
